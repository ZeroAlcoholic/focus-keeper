[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-keeper"
version = "0.1.0"
description = "全地端、低延遲的單人頭肩構圖監測"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python==4.12.0.88",
    "numpy==2.2.6",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
focus-keeper = "focus_keeper.cli:main"

[tool.setuptools]
packages = ["focus_keeper", "focus_keeper.detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
